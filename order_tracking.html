<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Order Tracking</title>
<link rel="icon" href="/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--primary:#FF6B00;--primary-dark:#E65C00;--primary-soft:#FFF3E8;--bg:#FFF9F4;--card:#fff;--text:#1F2937;--muted:#6B7280;--border:#E5E7EB;
--green:#16A34A;--green-bg:#DCFCE7;--blue:#2563EB;--blue-bg:#DBEAFE;--amber:#D97706;--amber-bg:#FEF3C7;--red:#DC2626;--red-bg:#FEE2E2;--purple:#7C3AED;--purple-bg:#EDE9FE;
--shadow:0 4px 18px rgba(255,107,0,.08);--shadow-lg:0 20px 50px rgba(17,24,39,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Poppins','Hind Siliguri',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;
background-image:radial-gradient(circle at 10% -10%,#FFE2CC 0,transparent 40%),radial-gradient(circle at 100% 0,#FFEBD9 0,transparent 35%)}
button,input,select{font-family:inherit;font-size:inherit}
a{color:var(--primary-dark);text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--text)}
.brand img{width:34px;height:34px;border-radius:10px;object-fit:cover;background:var(--primary-soft)}
.brand .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#FF9A4D);color:#fff;display:none;align-items:center;justify-content:center}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--border);padding:6px 11px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:pulse 2s infinite}
.live.off i{background:#9CA3AF;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.btn{border:0;cursor:pointer;border-radius:12px;padding:9px 15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.15s;font-size:13.5px}
.btn-p{background:linear-gradient(135deg,var(--primary),#FF8A33);color:#fff;box-shadow:0 6px 16px rgba(255,107,0,.28)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(255,107,0,.36)}
.btn-o{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.btn-wa{background:#22C55E;color:#fff}
.ico-btn{width:38px;height:38px;padding:0;justify-content:center}
/* states */
.center{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid #FFE2CC;border-top-color:var(--primary);animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.errbox{background:#fff;border:1px solid var(--border);border-radius:22px;padding:34px 26px;max-width:420px;box-shadow:var(--shadow)}
.errbox .big{width:72px;height:72px;border-radius:50%;background:var(--red-bg);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px}
.errbox h2{font-size:19px;margin-bottom:6px}.errbox p{color:var(--muted);font-size:14px;margin-bottom:16px}
/* profile */
.hero{margin-top:20px;background:linear-gradient(135deg,#FF6B00 0%,#FF9A4D 100%);border-radius:24px;padding:22px;color:#fff;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(255,107,0,.28)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{width:240px;height:240px;right:-70px;top:-90px}.hero:after{width:140px;height:140px;right:90px;bottom:-80px}
.hero-in{position:relative;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avatar{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700;flex:none}
.hero h1{font-size:22px;line-height:1.2}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:12.5px;opacity:.95}
.hero .meta span{display:inline-flex;align-items:center;gap:6px}
.hero .acts{margin-left:auto;display:flex;gap:8px}
.hero .btn{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4)}
.hero .btn:hover{background:#fff;color:var(--primary-dark)}
.notice{margin-top:14px;background:var(--amber-bg);border:1px solid #FCD34D;color:#92400E;border-radius:14px;padding:11px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px 15px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);transition:.15s}
.stat:hover{transform:translateY(-2px)}
.stat .si{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.stat b{display:block;font-size:19px;line-height:1.15}.stat small{color:var(--muted);font-size:12px}
.c-o{background:var(--primary-soft);color:var(--primary)}.c-g{background:var(--green-bg);color:var(--green)}.c-b{background:var(--blue-bg);color:var(--blue)}
.c-a{background:var(--amber-bg);color:var(--amber)}.c-p{background:var(--purple-bg);color:var(--purple)}.c-r{background:var(--red-bg);color:var(--red)}
/* money */
.money{margin-top:12px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.money .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px;gap:8px;flex-wrap:wrap}
.money .row b{color:var(--text)}
.bar{height:10px;border-radius:99px;background:#F3F4F6;overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),#FFB070);transition:width .7s}
.bar.g>div{background:linear-gradient(90deg,#16A34A,#4ADE80)}
/* toolbar */
.tools{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;flex:1;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border);background:#fff;border-radius:99px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--muted);transition:.15s}
.chip b{margin-left:5px;background:#F3F4F6;border-radius:99px;padding:0 7px;font-size:11.5px;color:var(--text)}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}.chip.on b{background:rgba(255,255,255,.25);color:#fff}
.search{position:relative;min-width:200px;flex:0 1 260px}
.search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#9CA3AF;font-size:13px}
.search input,.sel{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:12px;background:#fff;outline:0}
.sel{padding:9px 12px;width:auto;cursor:pointer}
.search input:focus,.sel:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,107,0,.15)}
/* table */
.tbl{margin-top:14px;background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th{background:#FFF7F0;text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:12px 14px;font-weight:600;white-space:nowrap}
td{padding:13px 14px;border-top:1px solid #F3F4F6;font-size:13.5px;vertical-align:middle}
tbody tr{cursor:pointer;transition:.12s}tbody tr:hover{background:#FFFAF5}
.svc{display:flex;gap:11px;align-items:center;min-width:220px}
.pi{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.svc b{display:block;font-weight:600;line-height:1.3;font-size:13.5px}.svc small{color:var(--muted);font-size:11.5px}
.oid{font-weight:600;color:var(--primary-dark)}
.num{white-space:nowrap}
.prog{min-width:110px}.prog small{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
.prog .bar{height:7px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-Completed{background:var(--green-bg);color:var(--green)}.s-Pending{background:var(--amber-bg);color:var(--amber)}
.s-InProgress{background:var(--blue-bg);color:var(--blue)}.s-Partial{background:var(--purple-bg);color:var(--purple)}.s-Cancelled{background:var(--red-bg);color:var(--red)}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}.empty i{font-size:38px;color:#FFD2B0;margin-bottom:10px;display:block}
.cards{display:none}
.card{padding:14px;border-top:1px solid #F3F4F6;cursor:pointer}
.card:first-child{border-top:0}
.card .l1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card .l3{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--muted)}
.card .l3 b{color:var(--text)}
.sumbar{margin-top:12px;display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;font-size:13px;color:var(--muted)}.sumbar b{color:var(--text)}
.foot{margin:34px 0 26px;text-align:center;color:var(--muted);font-size:12.5px}
.foot .ct{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.5);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.md{background:#fff;border-radius:24px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .22s}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}
.md-h{padding:20px 22px 14px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid #F3F4F6}
.md-h h3{font-size:16px;line-height:1.35}.md-h small{color:var(--muted)}
.x{margin-left:auto;border:0;background:#F3F4F6;width:34px;height:34px;border-radius:50%;cursor:pointer;flex:none}.x:hover{background:var(--red-bg);color:var(--red)}
.md-b{padding:18px 22px 22px}
.steps{display:flex;align-items:flex-start;margin:4px 0 20px}
.stp{flex:1;text-align:center;position:relative;font-size:11px;color:var(--muted)}
.stp:before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:#E5E7EB}
.stp:first-child:before{display:none}
.stp.done:before,.stp.cur:before{background:var(--primary)}
.stp i{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;background:#E5E7EB;color:#9CA3AF;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:13px}
.stp.done i{background:var(--primary);color:#fff}.stp.cur i{background:#fff;border:3px solid var(--primary);color:var(--primary);box-shadow:0 0 0 5px rgba(255,107,0,.15)}
.stp.cur{color:var(--primary-dark);font-weight:600}
.steps.bad .stp.cur i{border-color:var(--red);color:var(--red);box-shadow:0 0 0 5px rgba(220,38,38,.12)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kv div{background:#FFF9F4;border:1px solid #FFE8D6;border-radius:14px;padding:10px 12px}
.kv small{display:block;color:var(--muted);font-size:11.5px}.kv b{font-size:15px}
.link{display:flex;align-items:center;gap:8px;background:#F9FAFB;border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:14px;font-size:13px;word-break:break-all}
.link a{flex:1}
.note{background:var(--primary-soft);border-left:4px solid var(--primary);border-radius:0 12px 12px 0;padding:11px 14px;font-size:13.5px;margin-bottom:14px}
.note small{display:block;color:var(--primary-dark);font-weight:600;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:#111827;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;z-index:200;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}.tbl table{display:none}.cards{display:block}.hero .acts{margin-left:0;width:100%}.search{flex:1 1 100%}}
@media(max-width:480px){.hero h1{font-size:19px}.live span{display:none}.kv{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><img src="/img/logo.png" alt="" id="logo" onerror="this.style.display='none';document.getElementById('logoFb').style.display='flex'"><span class="lg" id="logoFb"><i class="fa-solid fa-bolt"></i></span><span id="siteName">Order Tracker</span></div>
  <div class="spacer"></div>
  <div class="live off" id="live"><i></i><span id="liveTxt">লোড হচ্ছে</span></div>
  <button class="btn btn-o ico-btn" id="refBtn" title="রিফ্রেশ" onclick="load(true)"><i class="fa-solid fa-rotate"></i></button>
</div></header>

<main class="wrap" id="app">
  <div class="center" id="loading"><div><div class="spin"></div><p style="color:var(--muted)">আপনার অর্ডার লোড হচ্ছে...</p></div></div>
</main>

<div class="ov" id="ov" onclick="if(event.target===this)closeM()"><div class="md" id="md"></div></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'৳'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const nf=n=>Number(n||0).toLocaleString('en-US');
const STEPS=['Pending','In Progress','Completed'];
const SLBL={Pending:'পেন্ডিং','In Progress':'চলমান',Completed:'সম্পন্ন',Partial:'আংশিক',Cancelled:'বাতিল'};
const sk=s=>String(s).replace(/\s/g,'');
let KEY='',DATA=null,filter='all',q='',sort='new',timer=null,lastOk=0,busy=false;

function getKey(){
  const u=new URL(location.href);
  let k=u.searchParams.get('key')||u.searchParams.get('k')||u.searchParams.get('');
  if(!k&&u.search.length>1){const m=u.search.match(/^\?=?([A-Za-z0-9]{8,})$/);if(m)k=m[1]}
  if(!k&&u.hash.length>8)k=u.hash.slice(1);
  if(!k){const m=u.pathname.match(/\/track\/([A-Za-z0-9]{8,})/);if(m)k=m[1]}
  return (k||'').replace(/[^A-Za-z0-9]/g,'');
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2000)}
function plat(sv){
  const s=String(sv).toLowerCase();
  const m=[['facebook|fb ','fa-brands fa-facebook-f','#1877F2','#E7F0FF'],['instagram|insta','fa-brands fa-instagram','#E1306C','#FDE7EF'],['tiktok','fa-brands fa-tiktok','#111827','#F3F4F6'],
  ['youtube|yt ','fa-brands fa-youtube','#FF0000','#FFE7E7'],['telegram','fa-brands fa-telegram','#229ED9','#E3F4FC'],['twitter|x \\(|twitter','fa-brands fa-x-twitter','#111827','#F3F4F6'],
  ['whatsapp','fa-brands fa-whatsapp','#22C55E','#E4F9EB'],['spotify','fa-brands fa-spotify','#1DB954','#E3F8EB'],['linkedin','fa-brands fa-linkedin-in','#0A66C2','#E6F0FA'],
  ['google|review|map','fa-brands fa-google','#EA4335','#FDEAE8'],['snapchat','fa-brands fa-snapchat','#CA9A00','#FFF8D6'],['discord','fa-brands fa-discord','#5865F2','#ECEEFF'],['website|traffic|seo','fa-solid fa-globe','#FF6B00','#FFF3E8']];
  for(const [re,ic,c,bg] of m) if(new RegExp(re).test(s+' ')) return {ic,c,bg};
  return {ic:'fa-solid fa-bolt',c:'#FF6B00',bg:'#FFF3E8'};
}
function pct(o){
  if(o.status==='Completed')return 100;
  if(o.status==='Cancelled'||!o.quantity)return o.status==='Cancelled'?0:0;
  return Math.max(0,Math.min(100,Math.round((o.quantity-o.remains)/o.quantity*100)));
}
function ago(ts){const s=Math.max(0,Math.round((Date.now()-ts)/1000));if(s<8)return 'এইমাত্র';if(s<60)return s+' সেকেন্ড আগে';const m=Math.floor(s/60);return m<60?m+' মিনিট আগে':Math.floor(m/60)+' ঘন্টা আগে'}
function fdate(o){return o.date||(o.createdAt?new Date(o.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'-')}

async function load(manual){
  if(busy)return; busy=true;
  if(manual)$('refBtn').firstElementChild.style.animation='sp .7s linear infinite';
  try{
    const ac=new AbortController(),t=setTimeout(()=>ac.abort(),20000);
    const r=await fetch('/api/track/'+encodeURIComponent(KEY),{signal:ac.signal,cache:'no-store'});clearTimeout(t);
    const j=await r.json().catch(()=>({}));
    if(!r.ok){if(!DATA)return fatal(r.status===404?'ট্র্যাকিং লিংক সঠিক নয়':'কিছু একটা সমস্যা হয়েছে',j.error||'পরে আবার চেষ্টা করুন');throw new Error(j.error)}
    const first=!DATA;DATA=j;lastOk=Date.now();
    if(first)render();else{renderDyn()}
    setLive(true);
    if(manual)toast('আপডেট হয়েছে');
  }catch(e){
    if(!DATA)fatal('সংযোগ পাওয়া যাচ্ছে না','ইন্টারনেট চেক করে আবার চেষ্টা করুন');
    else{setLive(false);if(manual)toast('আপডেট করা যায়নি')}
  }finally{busy=false;$('refBtn').firstElementChild.style.animation=''}
}
function fatal(t,m){
  $('app').innerHTML='<div class="center"><div class="errbox"><div class="big"><i class="fa-solid fa-link-slash"></i></div><h2>'+esc(t)+'</h2><p>'+esc(m)+'</p><button class="btn btn-p" onclick="location.reload()"><i class="fa-solid fa-rotate"></i> আবার চেষ্টা করুন</button></div></div>';
  setLive(false);$('liveTxt').textContent='অফলাইন';
}
function setLive(ok){$('live').classList.toggle('off',!ok);tick()}
function tick(){if(!lastOk)return;const off=$('live').classList.contains('off');$('liveTxt').textContent=off?'সংযোগ নেই':'আপডেট: '+ago(lastOk)}

function render(){
  const c=DATA.customer,st=DATA.settings;
  document.title=(c.name||'Order')+' • '+(st.siteName||'Order Tracker');
  $('siteName').textContent=st.siteName||'Order Tracker';
  const contact=[];
  if(st.whatsapp)contact.push('<a class="btn btn-wa" target="_blank" rel="noopener" href="https://wa.me/'+esc(st.whatsapp)+'"><i class="fa-brands fa-whatsapp"></i> WhatsApp সাপোর্ট</a>');
  if(st.phone)contact.push('<a class="btn btn-o" href="tel:'+esc(st.phone)+'"><i class="fa-solid fa-phone"></i> '+esc(st.phone)+'</a>');
  if(st.email)contact.push('<a class="btn btn-o" href="mailto:'+esc(st.email)+'"><i class="fa-solid fa-envelope"></i> ইমেইল</a>');
  $('app').innerHTML=
  '<section class="hero"><div class="hero-in"><div class="avatar">'+esc(c.avatar)+'</div><div><h1>'+esc(c.name)+'</h1><div class="meta">'+
  (c.email?'<span><i class="fa-regular fa-envelope"></i>'+esc(c.email)+'</span>':'')+(c.phone?'<span><i class="fa-solid fa-phone"></i>'+esc(c.phone)+'</span>':'')+(c.joined?'<span><i class="fa-regular fa-calendar"></i>যোগদান: '+esc(c.joined)+'</span>':'')+
  '</div></div><div class="acts"><button class="btn" onclick="shareLink()"><i class="fa-solid fa-share-nodes"></i> শেয়ার</button><button class="btn" onclick="copyLink()"><i class="fa-regular fa-copy"></i> লিংক</button></div></div></section>'+
  (st.notice?'<div class="notice"><i class="fa-solid fa-bullhorn" style="margin-top:3px"></i><div>'+esc(st.notice)+'</div></div>':'')+
  '<div id="dyn"></div>'+
  '<footer class="foot"><div class="ct">'+contact.join('')+'</div>© '+new Date().getFullYear()+' '+esc(st.siteName||'')+' • এই পেজটি অটো আপডেট হয়</footer>';
  renderDyn();
}
function counts(){const o=DATA.orders,k={all:o.length,Completed:0,'In Progress':0,Pending:0,Partial:0,Cancelled:0};o.forEach(x=>{if(k[x.status]!=null)k[x.status]++});return k}
function renderDyn(){
  const c=DATA.customer,os=DATA.orders,k=counts();
  const active=os.filter(o=>o.status!=='Cancelled').length;
  const paidPct=c.spent>0?Math.min(100,Math.round(c.paid/c.spent*100)):100;
  const due=c.due;
  $('dyn').innerHTML=
  '<div class="stats">'+
  st('fa-layer-group','c-o',k.all,'মোট অর্ডার')+st('fa-circle-check','c-g',k.Completed,'সম্পন্ন')+st('fa-spinner','c-b',k['In Progress'],'চলমান')+st('fa-clock','c-a',k.Pending,'পেন্ডিং')+'</div>'+
  '<div class="money"><div class="row"><span>মোট খরচ <b>'+fmt(c.spent)+'</b></span><span>পরিশোধ <b style="color:var(--green)">'+fmt(c.paid)+'</b></span><span>'+(due>0?'বাকি <b style="color:var(--red)">'+fmt(due)+'</b>':due<0?'অগ্রিম <b style="color:var(--green)">'+fmt(-due)+'</b>':'<b style="color:var(--green)">সম্পূর্ণ পরিশোধিত ✓</b>')+'</span></div><div class="bar g"><div style="width:'+paidPct+'%"></div></div></div>'+
  '<div class="tools"><div class="chips" id="chips">'+
  [['all','সব'],['Pending','পেন্ডিং'],['In Progress','চলমান'],['Completed','সম্পন্ন'],['Partial','আংশিক'],['Cancelled','বাতিল']].filter(x=>x[0]==='all'||k[x[0]]).map(x=>'<button class="chip'+(filter===x[0]?' on':'')+'" onclick="setF(\''+x[0]+'\')">'+x[1]+'<b>'+k[x[0]]+'</b></button>').join('')+
  '</div><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" placeholder="সার্ভিস, লিংক বা অর্ডার আইডি" value="'+esc(q)+'" oninput="q=this.value;list()"></div>'+
  '<select class="sel" onchange="sort=this.value;list()"><option value="new"'+(sort==='new'?' selected':'')+'>নতুন আগে</option><option value="old"'+(sort==='old'?' selected':'')+'>পুরনো আগে</option><option value="high"'+(sort==='high'?' selected':'')+'>বেশি দাম</option></select></div>'+
  '<div class="tbl"><div id="tb"></div></div><div class="sumbar" id="sb"></div>';
  list();
}
function st(i,c,v,l){return '<div class="stat"><div class="si '+c+'"><i class="fa-solid '+i+'"></i></div><div><b>'+nf(v)+'</b><small>'+l+'</small></div></div>'}
function setF(f){filter=f;renderDyn()}
function list(){
  let a=DATA.orders.filter(o=>filter==='all'||o.status===filter);
  const s=q.trim().toLowerCase();
  if(s)a=a.filter(o=>(o.service+' '+o.link+' '+o.orderId).toLowerCase().includes(s));
  a=a.slice().sort((x,y)=>sort==='old'?x.createdAt-y.createdAt:sort==='high'?y.charge-x.charge:y.createdAt-x.createdAt);
  const tb=$('tb');
  if(!a.length){tb.innerHTML='<div class="empty"><i class="fa-regular fa-folder-open"></i>'+(DATA.orders.length?'কোনো অর্ডার মেলেনি':'এখনও কোনো অর্ডার নেই')+'</div>';$('sb').innerHTML='';return}
  const row=o=>{const p=plat(o.service),pc=pct(o);return {p,pc}};
  tb.innerHTML='<table><thead><tr><th>অর্ডার</th><th>সার্ভিস</th><th>পরিমাণ</th><th>অগ্রগতি</th><th>দাম</th><th>স্ট্যাটাস</th></tr></thead><tbody>'+
  a.map(o=>{const {p,pc}=row(o);return '<tr onclick="openO(\''+esc(o.id)+'\')"><td><span class="oid">'+esc(o.orderId||'—')+'</span><br><small style="color:var(--muted)">'+esc(fdate(o))+'</small></td>'+
  '<td><div class="svc"><div class="pi" style="background:'+p.bg+';color:'+p.c+'"><i class="'+p.ic+'"></i></div><div><b>'+esc(o.service)+'</b><small>'+esc((o.link||'').replace(/^https?:\/\//,'').slice(0,38))+'</small></div></div></td>'+
  '<td class="num">'+nf(o.quantity)+'</td><td class="prog"><small><span>'+pc+'%</span><span>বাকি '+nf(o.status==='Completed'?0:o.remains)+'</span></small><div class="bar"><div style="width:'+pc+'%"></div></div></td>'+
  '<td class="num"><b>'+fmt(o.charge)+'</b></td><td>'+badge(o.status)+'</td></tr>'}).join('')+'</tbody></table>'+
  '<div class="cards">'+a.map(o=>{const {p,pc}=row(o);return '<div class="card" onclick="openO(\''+esc(o.id)+'\')"><div class="l1"><span class="oid">'+esc(o.orderId||'—')+'</span>'+badge(o.status)+'</div>'+
  '<div class="svc" style="min-width:0"><div class="pi" style="background:'+p.bg+';color:'+p.c+'"><i class="'+p.ic+'"></i></div><div><b>'+esc(o.service)+'</b><small>'+esc(fdate(o))+'</small></div></div>'+
  '<div class="prog" style="margin-top:10px"><small><span>'+pc+'% সম্পন্ন</span><span>'+nf(o.quantity)+' পিস</span></small><div class="bar"><div style="width:'+pc+'%"></div></div></div>'+
  '<div class="l3"><span>দাম <b>'+fmt(o.charge)+'</b></span><span><i class="fa-solid fa-chevron-right"></i></span></div></div>'}).join('')+'</div>';
  const tot=a.reduce((s,o)=>s+(o.status==='Cancelled'?0:o.charge),0);
  $('sb').innerHTML='<span>দেখানো হচ্ছে <b>'+a.length+'</b> টি</span><span>মোট <b>'+fmt(tot)+'</b></span>';
}
function badge(s){return '<span class="badge s-'+sk(s)+'">'+esc(SLBL[s]||s)+'</span>'}
function openO(id){
  const o=DATA.orders.find(x=>x.id===id);if(!o)return;
  const p=plat(o.service),pc=pct(o),bad=o.status==='Cancelled'||o.status==='Partial';
  const idx=o.status==='Completed'?2:o.status==='In Progress'?1:o.status==='Pending'?0:o.status==='Partial'?1:1;
  const lbl=[['fa-clock','পেন্ডিং'],['fa-spinner','চলমান'],['fa-check','সম্পন্ন']];
  const stp=lbl.map((x,i)=>{let cls=i<idx?'done':i===idx?'cur':'';let ic=x[0],tx=x[1];
    if(i===idx&&o.status==='Cancelled'){ic='fa-xmark';tx='বাতিল'}if(i===idx&&o.status==='Partial'){ic='fa-circle-half-stroke';tx='আংশিক'}
    if(o.status==='Completed'&&i===2)cls='done';return '<div class="stp '+cls+'"><i class="fa-solid '+ic+'"></i>'+tx+'</div>'}).join('');
  const delivered=o.status==='Completed'?o.quantity:Math.max(0,o.quantity-o.remains);
  $('md').innerHTML='<div class="md-h"><div class="pi" style="background:'+p.bg+';color:'+p.c+'"><i class="'+p.ic+'"></i></div><div><h3>'+esc(o.service)+'</h3><small>'+esc(o.orderId||'')+' • '+esc(fdate(o))+'</small></div><button class="x" onclick="closeM()"><i class="fa-solid fa-xmark"></i></button></div>'+
  '<div class="md-b"><div class="steps'+(bad?' bad':'')+'">'+stp+'</div>'+
  '<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px"><span style="color:var(--muted)">অগ্রগতি</span><b>'+pc+'%</b></div><div class="bar"><div style="width:'+pc+'%"></div></div></div>'+
  '<div class="kv"><div><small>অর্ডার পরিমাণ</small><b>'+nf(o.quantity)+'</b></div><div><small>ডেলিভারি হয়েছে</small><b>'+nf(delivered)+'</b></div><div><small>স্টার্ট কাউন্ট</small><b>'+nf(o.startCount)+'</b></div><div><small>বাকি</small><b>'+nf(o.status==='Completed'?0:o.remains)+'</b></div><div><small>দাম</small><b>'+fmt(o.charge)+'</b></div><div><small>স্ট্যাটাস</small><b style="font-size:13px">'+badge(o.status)+'</b></div></div>'+
  (o.link?'<div class="link"><i class="fa-solid fa-link" style="color:var(--primary)"></i>'+(/^https?:\/\//i.test(o.link)?'<a href="'+esc(o.link)+'" target="_blank" rel="noopener noreferrer">'+esc(o.link)+'</a>':'<span style="flex:1">'+esc(o.link)+'</span>')+'<button class="btn btn-o ico-btn" style="width:32px;height:32px" onclick="cp(\''+esc(o.link).replace(/\'/g,'')+'\')"><i class="fa-regular fa-copy"></i></button></div>':'')+
  (o.note?'<div class="note"><small><i class="fa-solid fa-message"></i> অ্যাডমিনের নোট</small>'+esc(o.note)+'</div>':'')+
  '<div style="font-size:12px;color:var(--muted);text-align:center">সর্বশেষ আপডেট: '+esc(new Date(o.updatedAt||o.createdAt).toLocaleString('en-GB'))+'</div>'+
  (DATA.settings.whatsapp?'<a class="btn btn-wa" style="width:100%;justify-content:center;margin-top:14px" target="_blank" rel="noopener" href="https://wa.me/'+esc(DATA.settings.whatsapp)+'?text='+encodeURIComponent('অর্ডার '+(o.orderId||'')+' নিয়ে জানতে চাই')+'"><i class="fa-brands fa-whatsapp"></i> এই অর্ডার নিয়ে সাপোর্টে লিখুন</a>':'')+'</div>';
  $('ov').classList.add('on');document.body.style.overflow='hidden';
}
function closeM(){$('ov').classList.remove('on');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
function cp(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('কপি হয়েছে')).catch(()=>{const i=document.createElement('input');i.value=t;document.body.appendChild(i);i.select();try{document.execCommand('copy');toast('কপি হয়েছে')}catch(e){}i.remove()})}
function copyLink(){cp(location.href)}
function shareLink(){if(navigator.share)navigator.share({title:document.title,url:location.href}).catch(()=>{});else copyLink()}

KEY=getKey();
if(!KEY)fatal('ট্র্যাকিং লিংক পাওয়া যায়নি','আপনার সাপোর্ট থেকে পাওয়া সম্পূর্ণ লিংকটি ব্যবহার করুন');
else{
  load();
  timer=setInterval(()=>{if(!document.hidden)load()},20000);
  setInterval(tick,5000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastOk>15000)load()});
}
</script>
</body>
</html>
